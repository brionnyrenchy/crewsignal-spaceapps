<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="CrewSignal — A health-monitoring research prototype for long missions. Record observations, explore changes, and prepare a report."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CrewSignal — Health monitoring research prototype</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('crewsignal.appearance') || 'system';
          var isDark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-appearance', pref);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
